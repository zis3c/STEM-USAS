name: Deploy to STEM Server

on:
  push:
    branches: [ "main" ]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to web root
        run: |
          sudo mkdir -p /var/www/stem
          sudo rsync -avz --delete dist/ /var/www/stem/
          sudo chown -R www-data:deploy /var/www/stem
          sudo chmod -R g+w /var/www/stem
